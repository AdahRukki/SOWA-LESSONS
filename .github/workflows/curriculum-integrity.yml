name: Curriculum integrity
on:
  push:
    paths:
      - 'src/preloadedCurriculum.json'
      - 'scripts/validate-curriculum.cjs'
      - '.github/workflows/curriculum-integrity.yml'
  pull_request:
    paths:
      - 'src/preloadedCurriculum.json'
      - 'scripts/validate-curriculum.cjs'
      - '.github/workflows/curriculum-integrity.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-curriculum.cjs
